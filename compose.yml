services:
  web:
    build: .
    command: fastapi dev app/main.py --port 8000
    ports:
      - 8000:8000
    depends_on:
      - db
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - .venv/
        - action: rebuild
          path: ./uv.lock
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    expose:
      - 5432
    environment:
      - POSTGRES_DB=fastapi
      - POSTGRES_USER=fastapi
      - POSTGRES_PASSWORD=fastapi

volumes:
  postgres_data:
  index_data:
    driver: local
